name: hybrid-iac-ci-cd

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate_and_lint:
    name: Validate and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible yamllint

      - name: Terraform format check
        run: terraform fmt -recursive -check

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: YAML lint
        run: yamllint ansible .yamllint.yml

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Ansible syntax check
        run: ansible-playbook -i ansible/inventory.ini.example ansible/deploy.yml --syntax-check

  deploy:
    name: Deploy hybrid environment
    needs: validate_and_lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    environment: production

    env:
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_vsphere_server: ${{ secrets.ESXI_HOST }}
      TF_VAR_vsphere_user: ${{ secrets.ESXI_USER }}
      TF_VAR_vsphere_password: ${{ secrets.ESXI_PASSWORD }}
      TF_VAR_admin_password: ${{ secrets.ESXI_GUEST_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Install deployment tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass netcat-openbsd
          ovftool --version

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Prepare SSH directory
        shell: bash
        run: |
          mkdir -p ~/.ssh

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve

      - name: Write Terraform SSH private key
        shell: bash
        run: |
          terraform output -raw ssh_private_key_pem > ~/.ssh/iac-lab.pem
          chmod 600 ~/.ssh/iac-lab.pem

      - name: Show Terraform SSH public key
        run: terraform output -raw ssh_public_key

      - name: Enable ESXi root SSH key login
        shell: bash
        run: |
          ESXI_IP="$(terraform output -raw vsphere_vm_private_ip)"
          terraform output -raw ssh_public_key > /tmp/iac-root-authorized-keys

          sshpass -p "${{ secrets.ESXI_GUEST_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${{ secrets.ESXI_GUEST_USER }}@${ESXI_IP}" \
            "command -v cloud-init >/dev/null && timeout 300 cloud-init status --wait || true"

          sshpass -p "${{ secrets.ESXI_GUEST_PASSWORD }}" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null /tmp/iac-root-authorized-keys "${{ secrets.ESXI_GUEST_USER }}@${ESXI_IP}:/tmp/iac-root-authorized-keys"

          sshpass -p "${{ secrets.ESXI_GUEST_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${{ secrets.ESXI_GUEST_USER }}@${ESXI_IP}" \
            "printf '%s\n' '${{ secrets.ESXI_GUEST_PASSWORD }}' | sudo -S -p '' sh -c 'mkdir -p /root/.ssh /etc/ssh/sshd_config.d && install -o root -g root -m 600 /tmp/iac-root-authorized-keys /root/.ssh/authorized_keys && printf \"%s\n\" \"PermitRootLogin prohibit-password\" \"PubkeyAuthentication yes\" > /etc/ssh/sshd_config.d/99-iac-root-login.conf && rm -f /tmp/iac-root-authorized-keys && (systemctl restart ssh || systemctl restart sshd)'"

      - name: Build Ansible inventory from Terraform outputs
        shell: bash
        run: |
          AZURE_IP="$(terraform output -raw azure_vm_public_ip)"
          ESXI_IP="$(terraform output -raw vsphere_vm_private_ip)"
          mkdir -p ansible/generated
          {
            echo "[hybrid]"
            echo "azure ansible_host=${AZURE_IP} ansible_user=${{ secrets.AZURE_VM_USER }} ansible_ssh_private_key_file=~/.ssh/iac-lab.pem wireguard_address=10.50.0.1 wireguard_listen_port=51820"
            echo "esxi ansible_host=${ESXI_IP} ansible_user=root ansible_ssh_private_key_file=~/.ssh/iac-lab.pem ansible_become=false wireguard_address=10.50.0.2"
          } > ansible/generated/inventory.ini

      - name: Accept SSH host keys
        shell: bash
        run: |
          ssh-keyscan -H "$(terraform output -raw azure_vm_public_ip)" >> ~/.ssh/known_hosts
          ssh-keyscan -H "$(terraform output -raw vsphere_vm_private_ip)" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/iac-lab.pem -o StrictHostKeyChecking=no root@"$(terraform output -raw vsphere_vm_private_ip)" whoami

      - name: Wait for SSH
        shell: bash
        run: |
          for host in "$(terraform output -raw azure_vm_public_ip)" "$(terraform output -raw vsphere_vm_private_ip)"; do
            for i in {1..30}; do
              nc -z "$host" 22 && break
              sleep 10
            done
          done

      - name: Install Ansible requirements
        shell: bash
        run: |
          python -m pip install --upgrade ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Ansible deployment
        run: ansible-playbook -i ansible/generated/inventory.ini ansible/deploy.yml
