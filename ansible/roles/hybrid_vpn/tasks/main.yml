---
- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: true

- name: Create WireGuard directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate WireGuard private key
  ansible.builtin.shell:
    cmd: umask 077 && wg genkey > /etc/wireguard/privatekey
    creates: /etc/wireguard/privatekey

- name: Generate WireGuard public key
  ansible.builtin.shell:
    cmd: wg pubkey < /etc/wireguard/privatekey > /etc/wireguard/publickey
    creates: /etc/wireguard/publickey

- name: Read WireGuard public key
  ansible.builtin.slurp:
    src: /etc/wireguard/publickey
  register: wireguard_public_key_file

- name: Read WireGuard private key
  ansible.builtin.slurp:
    src: /etc/wireguard/privatekey
  register: wireguard_private_key_file

- name: Store WireGuard public key fact
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ wireguard_public_key_file.content | b64decode | trim }}"

- name: Store WireGuard private key fact
  ansible.builtin.set_fact:
    wireguard_private_key: "{{ wireguard_private_key_file.content | b64decode | trim }}"

- name: Render WireGuard config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart WireGuard

- name: Enable WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
